# ngspice, from this flake's dev shell: SPICE netlists, both tests/netlist/
# decks (judged against their .expected.json by rawcheck.py) and the external
# manifests' decks (stdout against upstream's .out). The Annex E tests under
# tests/spice/ are Verilog-AMS sources; ngspice runs those through
# openvaf.conf. A `* VPI FIXTURE` deck tests ESPice's own VPI extension: SKIP.
# A deck with `measure` checks or a Fourier plot runs once more without -r,
# where its .meas lines and .four tables print: ngspice refuses both under
# -b -r. A deck in another dialect (its oracle's `tokenizer`) is translated
# to ngspice first (`sprack project`, rawcheck.py).
run.netlist = grep -q '^\*[[:space:]]*VPI FIXTURE' "$CONFORM_SRC" && { echo "VPI fixture: an ESPice extension" >&2; exit 77; }; export SPRACK_TO=ngspice; export ngspice_vpath="$CONFORM_DIR"; [ -d "$CONFORM_INCLUDE/bin" ] && export SPICE_SCRIPTS="$CONFORM_INCLUDE/bin"; python3 "$CONFORM_TOOLDIR/rawcheck.py" 'ngspice --batch ${RAW:+-r "$RAW"} "$DECK"' 'ngspice --batch "$DECK"'
# The tool's exact version, for a dump's tool.json.
version = ngspice --version | grep -m1 ngspice
