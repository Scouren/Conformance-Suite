# ESPice, https://github.com/OpenFAT/EGSpice: SPICE netlists, judged as in
# ngspice.conf. ESPICE overrides the executable. A deck whose oracle names
# another dialect (`tokenizer`: hspice, spectre) is translated to ESPice's
# first (`sprack project --to espice`, rawcheck.py). A `* VPI FIXTURE` deck loads ESPice's VPI test library
# (built by ESPice from tests/netlist/hdl/veriloga_vpi_app.assets/vpi_gain.c),
# named by ESPICE_VPI; without it the deck SKIPs.
run.netlist = VPI_ARGS=; if grep -q '^\*[[:space:]]*VPI FIXTURE' "$CONFORM_SRC"; then [ -n "$ESPICE_VPI" ] || { echo "VPI fixture: set ESPICE_VPI to the built vpi_gain library" >&2; exit 77; }; VPI_ARGS="--vpi $ESPICE_VPI"; fi; export VPI_ARGS SPRACK_TO=espice SPRACK_READS=ngspice; python3 "$CONFORM_TOOLDIR/rawcheck.py" '${ESPICE:-espice} --format=binary -b ${RAW:+-r "$RAW"} $VPI_ARGS "$DECK"'
# The tool's exact version, for a dump's tool.json.
version = ${ESPICE:-espice} --version 2>&1 | head -1
