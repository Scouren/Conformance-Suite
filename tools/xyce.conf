# Xyce (Sandia), from nixpkgs: the tests/netlist/ decks, each translated to
# Xyce's dialect first (`sprack project --to xyce`, rawcheck.py), its binary
# raw file (-r) judged against the deck's .expected.json. A `* VPI FIXTURE`
# deck tests ESPice's own VPI extension: SKIP. Measures read Xyce's stdout,
# from a second run without -r.
run.netlist = grep -q '^\*[[:space:]]*VPI FIXTURE' "$CONFORM_SRC" && { echo "VPI fixture: an ESPice extension" >&2; exit 77; }; export SPRACK_TO=xyce; python3 "$CONFORM_TOOLDIR/rawcheck.py" 'Xyce ${RAW:+-r "$RAW"} "$DECK"' 'Xyce "$DECK"'
# The tool's exact version, for a dump's tool.json.
version = Xyce -v 2>&1 | head -1
