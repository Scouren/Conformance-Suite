# ngspice with every tests/netlist/ deck converged far past its own
# tolerances: the deck plus `.options reltol=1e-9 vntol=1e-15 abstol=1e-18`
# (a card after `.end` still reads), judged against the deck's
# .expected.json by rawcheck.py. A golden that ngspice.conf passes and this
# fails was recorded looser than its rtol claims: ngspice stopped Newton
# within its reltol of the answer, so the golden checks ngspice's iterates,
# not the circuit. Decks without an .expected.json SKIP.
# ponytail: reltol=1e-9 shrinks transient steps too; a slow deck TIMEOUTs
# under -T, so run the dc, op, tf, ac and temp trees first. Measures come
# from a second run without -r, as in ngspice.conf.
run.netlist = grep -q '^\*[[:space:]]*VPI FIXTURE' "$CONFORM_SRC" && { echo "VPI fixture: an ESPice extension" >&2; exit 77; }; export ngspice_vpath="$CONFORM_DIR"; [ -d "$CONFORM_INCLUDE/bin" ] && export SPICE_SCRIPTS="$CONFORM_INCLUDE/bin"; python3 "$CONFORM_TOOLDIR/rawcheck.py" '[ -n "$RAW" ] || exit 77; { cat "$DECK"; printf "\n.options reltol=1e-9 vntol=1e-15 abstol=1e-18\n"; } > "$RAW.sp" && ngspice --batch -r "$RAW" "$RAW.sp"' '{ cat "$DECK"; printf "\n.options reltol=1e-9 vntol=1e-15 abstol=1e-18\n"; } > "$CONFORM_WORK/measure.sp" && ngspice --batch "$CONFORM_WORK/measure.sp"'
