# VACASK, built by this flake: the tests/netlist/ decks, each translated to
# VACASK's dialect first (`sprack project --to vacask`, rawcheck.py). VACASK
# writes one binary raw file per analysis into its working directory (the
# translated copy); they are joined, in name order, into the raw file the
# oracle judges. A `* VPI FIXTURE` deck tests ESPice's own VPI extension: SKIP.
run.netlist = grep -q '^\*[[:space:]]*VPI FIXTURE' "$CONFORM_SRC" && { echo "VPI fixture: an ESPice extension" >&2; exit 77; }; export SPRACK_TO=vacask; python3 "$CONFORM_TOOLDIR/rawcheck.py" 'rm -f ./*.raw; vacask -qp "$DECK" || exit; [ -z "$RAW" ] || cat ./*.raw > "$RAW"'
# The tool's exact version, for a dump's tool.json (VACASK builds without one;
# ci.sh records its source revision).
version = vacask --help 2>&1 | head -1
