# Every tool's full output over the suite (README.md, "Dumps"), published as
# a versioned release: dumps-<run number>, holding the tarball, its
# manifest.json and SHA256SUMS. Never committed.
name: dumps

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: dumps
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        tool: [ngspice, xyce, vacask, espice, vera, openvaf, iverilog, verilator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # not recursive: sv-tests nests LLVM, Yosys, ... and fills the disk
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: tools/ci.sh ${{ matrix.tool }} results/dumps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dump-${{ matrix.tool }}
          path: results/dumps/
          if-no-files-found: ignore

  release:
    needs: dump
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dump-*
          path: results/dumps
          merge-multiple: true
      - name: Manifest, tarball, checksums
        run: |
          mkdir -p results/dumps release
          missing=()
          for t in ngspice xyce vacask espice vera openvaf iverilog verilator; do
            [ -f "results/dumps/$t/tool.json" ] || missing+=("$t=unavailable: its dump job left no dump ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)")
          done
          python3 -m harness.dump manifest results/dumps "hspice=unavailable: licensed; no runner holds a license" "${missing[@]}"
          tag=dumps-$GITHUB_RUN_NUMBER
          tar -C results -czf "release/$tag.tar.gz" dumps
          cp results/dumps/manifest.json "release/$tag.manifest.json"
          (cd release && sha256sum "$tag.tar.gz" "$tag.manifest.json" > SHA256SUMS)
          echo "tag=$tag" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Dumps $(date -u +%F), suite ${GITHUB_SHA::7}" \
            --notes "Every tool's full output over the suite at $GITHUB_SHA. Verify: \`sha256sum -c SHA256SUMS\`; README.md, Dumps, describes the format."
