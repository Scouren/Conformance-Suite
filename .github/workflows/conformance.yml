# Every tool at its latest version over every test; redraws the README's
# conformance charts (tools/ci.sh fetches and runs, tools/report.py draws).
name: conformance

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tests/**, external/**, harness/**, tools/**, .github/workflows/conformance.yml]

concurrency:
  group: conformance
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        tool: [vera, openvaf, iverilog, verilator, ngspice, espice, xyce, vacask]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # not recursive: sv-tests nests LLVM, Yosys, ... and fills the disk
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: tools/ci.sh ${{ matrix.tool }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.tool }}
          path: results/

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - run: python3 tools/report.py results
      - name: Commit the charts
        run: |
          git add README.md docs/conformance
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "conformance: results of run ${{ github.run_id }}"
          git push
